<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121719" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Финучёт КР">
<meta name="description" content="Тренажёр к КР №1 по финансовому учёту: билеты, экзамен, счета, баланс, проводки.">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Билеты по финучёту</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Literata:opsz,wght@7..72,600&display=swap">
<style>
/* Layout: one narrow phone column; sticky top bar, sticky bottom action bar in thumb reach. Calm graphite + sage. */
:root{
  --bg:#eef1f0; --surface:#ffffff; --ink:#1e282b; --muted:#637176; --line:#d9e0de; --soft:#e5ebe9;
  --accent:#3b6f63; --accent-soft:#dfeae6; --good:#3c7656; --good-soft:#e1eee6; --bad:#a65448; --bad-soft:#f5e6e3; --warn:#8a6a2c; --warn-soft:#f2ead8;
  --f-body:"Golos Text", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-head:"Literata", Georgia, serif;
  --f-num:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121719; --surface:#1a2124; --ink:#e1e8e6; --muted:#93a2a6; --line:#2a3438; --soft:#222b2e;
  --accent:#86baa9; --accent-soft:#213430; --good:#7fb894; --good-soft:#1f3329; --bad:#de8f84; --bad-soft:#3a2623; --warn:#d4b06c; --warn-soft:#342c1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121719; --surface:#1a2124; --ink:#e1e8e6; --muted:#93a2a6; --line:#2a3438; --soft:#222b2e;
  --accent:#86baa9; --accent-soft:#213430; --good:#7fb894; --good-soft:#1f3329; --bad:#de8f84; --bad-soft:#3a2623; --warn:#d4b06c; --warn-soft:#342c1b; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;touch-action:manipulation;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
button{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;gap:10px;min-height:56px;padding-block:8px}
.top h1{font:600 17px/1.2 var(--f-body);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink)}
.counter{font:500 14px var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.view{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* home */
.hero{padding-top:8px;display:grid;gap:4px}
.hero h2{font:600 28px/1.15 var(--f-head);margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:2px}
.stat b{font:500 22px var(--f-num);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.25}
.primary{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:14px 18px;border-radius:var(--r);border:0;background:var(--accent);color:var(--surface);cursor:pointer;text-align:left}
.primary b{font-size:18px;font-weight:600;display:block}
.primary span{font-size:14px;opacity:.85}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mitem{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 16px;border:0;background:none;text-align:left;cursor:pointer;border-top:1px solid var(--soft)}
.mitem:first-child{border-top:0}
.mitem .t{flex:1;min-width:0;display:grid}
.mitem .t b{font-weight:500;font-size:17px}
.mitem .t span{font-size:13.5px;color:var(--muted)}
.mitem .chev{color:var(--muted);flex:none}
.badge{font:500 13px var(--f-num);padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted);flex:none}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.resume{background:var(--accent-soft);border:1px solid transparent;border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left}
.resume .t{flex:1;display:grid}.resume b{font-weight:600}.resume span{font-size:14px;color:var(--muted)}
.foot{display:grid;gap:10px;font-size:13.5px;color:var(--muted);padding-top:4px}
.foot .row{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:38px}
.chipbtn.danger{color:var(--bad)}

/* grid of tickets */
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{aspect-ratio:1;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;align-content:center;gap:0;cursor:pointer;font:500 18px var(--f-num)}
.tile small{font:400 11px var(--f-body);color:var(--muted)}
.tile.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.tile.err small{color:var(--bad)}
.note{font-size:14px;color:var(--muted)}
.bar{height:4px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* quiz */
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:500 13px var(--f-num);color:var(--muted);cursor:pointer}
.pill.cur{border-color:var(--ink);color:var(--ink)}
.pill.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pill.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.pill.cur.ok,.pill.cur.bad{outline:1.5px solid var(--ink);outline-offset:1px}
.qtag{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.qtext{font-size:19px;line-height:1.4;font-weight:500;margin:0;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:54px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;font-size:16.5px;line-height:1.35}
.opt .mk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;margin-top:-1px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .mk{border-color:var(--good);background:var(--good);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .mk{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.6}
.opt:disabled{cursor:default;color:var(--ink)}
.opt:focus-visible,.primary:focus-visible,.mitem:focus-visible,.chipbtn:focus-visible,.pill:focus-visible,.tile:focus-visible,.iconbtn:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.expl{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:14px 16px;font-size:15.5px;display:grid;gap:4px}
.expl b{font-weight:600}
.expl.good b{color:var(--good)}.expl.bad b{color:var(--bad)}
.mono{font-family:var(--f-num);font-size:.94em}

/* bottom bar */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bottom .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px}
.act{flex:1;min-height:52px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:17px;cursor:pointer}
.act.main{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.act.ghost{flex:0 0 auto;padding:0 18px;font-weight:500;color:var(--muted)}

/* result */
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:6px;text-align:center}
.res .big{font:600 44px/1 var(--f-num);font-variant-numeric:tabular-nums}
.res .st{font-weight:600}.res .st.good{color:var(--good)}.res .st.bad{color:var(--bad)}
.res p{margin:0;color:var(--muted);font-size:14.5px}
.wrong{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.witem{padding:12px 16px;border-top:1px solid var(--soft);display:grid;gap:4px;font-size:15px}
.witem:first-child{border-top:0}
.witem .a{color:var(--good);font-size:14.5px}
.witem .tag{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
h3.sec{font:600 15px var(--f-body);margin:6px 2px 0;color:var(--muted)}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:text}
.slot span{font-size:13px;color:var(--muted)}
.slot input{font:500 28px var(--f-num);border:0;background:transparent;color:var(--ink);width:100%;padding:0;outline:none;min-width:0}
.slot input::placeholder{color:var(--line)}
.slot.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slot.ok{border-color:var(--good);background:var(--good-soft)}
.slot.bad{border-color:var(--bad);background:var(--bad-soft)}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.key{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:500 15px var(--f-num);color:var(--ink);cursor:pointer}
.key:active{background:var(--soft)}
.legend{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:2px 12px}
.legend b{color:var(--ink);font-weight:600}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.scard.ok{border-color:var(--good)}.scard.bad{border-color:var(--bad)}
.sitem{display:flex;gap:10px;font-size:16px;line-height:1.35}
.sn{font:500 13px var(--f-num);color:var(--muted);min-width:18px;padding-top:2px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.seg button.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.seg button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.seg button:disabled{cursor:default}
.seg button:focus-visible,.key:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sexpl{font-size:14px;color:var(--muted)}
.tile.mid{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tile.weak{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.tile.none{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.tile.mid small,.tile.weak small,.tile.none small{color:inherit}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:none}
.dot.ok,.dot.great{background:var(--good)}.dot.mid,.dot.good{background:var(--accent)}.dot.weak,.dot.bad{background:var(--warn)}.dot.none{background:var(--bad)}.dot.fresh{background:var(--line)}
.opt.idk{border-style:dashed;color:var(--muted)}
.opt.idk .mk{border-style:dashed}
.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lv{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:3px;cursor:pointer;align-content:start}
.lv .lvn{font:500 26px/1.1 var(--f-num);font-variant-numeric:tabular-nums}
.lv b{font-weight:600;font-size:15px;display:flex;align-items:center}
.lv .d{font-size:12.5px;color:var(--muted);line-height:1.3}
.lv:disabled{opacity:.55;cursor:default}
.lv:focus-visible,.arow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg3{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.arow{display:flex;gap:12px;align-items:center;width:100%;min-height:50px;padding:10px 16px;border:0;border-top:1px solid var(--soft);background:none;text-align:left;cursor:pointer;font-size:16px;color:var(--ink)}
.arow:first-child{border-top:0}
.arow .no{font:500 16px var(--f-num);min-width:30px;color:var(--accent)}
.arow .nm{flex:1;min-width:0}
.hide-nm .arow:not(.reveal) .nm,.hide-no .arow:not(.reveal) .no{color:transparent;background:var(--soft);border-radius:6px}
.brow{display:flex;gap:10px;align-items:baseline;padding:10px 16px;border-top:1px solid var(--soft);font-size:15px}
.brow:first-child{border-top:0}
.brow .bn{flex:1;min-width:0}
.brow .ba{font:500 15px var(--f-num);white-space:nowrap;font-variant-numeric:tabular-nums}
.brow .btag{font:600 12px var(--f-body);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;white-space:nowrap}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot.sm input{font-size:20px}
.slot.sm span{font-size:12px;line-height:1.25}
.slot .good-v{color:var(--good);font:500 13px var(--f-num)}
.th{display:grid;gap:8px}
.th details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.th summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px}
.th summary::-webkit-details-marker{display:none}
.th summary::after{content:"+";font:500 18px var(--f-num);color:var(--muted)}
.th details[open] summary::after{content:"−"}
.th summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.th .tb{padding:0 16px 16px;font-size:15.5px;line-height:1.5;display:grid;gap:10px}
.th .tb p,.th .tb ul,.th .tb ol{margin:0}
.th .tb ul,.th .tb ol{padding-left:20px;display:grid;gap:4px}
.tw{overflow-x:auto;border:1px solid var(--soft);border-radius:10px}
.tw table{border-collapse:collapse;width:100%;font-size:14px}
.tw th,.tw td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--soft);vertical-align:top}
.tw th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg)}
.tw tr:last-child td{border-bottom:0}
.tw td.nw,.tw td.mono{white-space:nowrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);font-size:15px}
</style>

</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main class="view" id="view"></main>
</div>
<div class="bottom" id="bottom" hidden><div class="in" id="bottomIn"></div></div>

<script>
/* ===================== QUESTION BANK ===================== */
const TOPICS = {
  kr:    'Теория к КР (по списку)',
  osn:   'Учёт в системе управления',
  sred:  'Актив и пассив',
  metod: 'Метод учёта',
  bal:   'Бухгалтерский баланс',
  vliy:  'Операции и баланс',
  scheta:'Счета и сальдо',
  s27:   '27 счетов',
  prov:  'Проводки',
  zad:   'Мини-задачи',
  otch:  'Отчётность и регулирование',
  razd:  'Разделы баланса',
  vvod:  'Проводки вручную',
  acc:   'Счета: номер и название'
};
// [question, options, correctIndex, explanation, fixedOrder?]
const RAW = {
osn: [
 ['Что обеспечивает бухгалтерский учёт в системе управления?',['Сбор, систематизацию и передачу информации о фактах хозяйственной жизни','Только составление налоговых деклараций','Планирование объёма продаж','Подбор и оценку персонала'],0,'Лекция 1: учёт обеспечивает сбор, систематизацию и передачу информации о фактах хозяйственной жизни и строит на их основе модель финансового состояния.'],
 ['Какая из функций НЕ относится к функциям учёта по лекции?',['Установление цен на продукцию','Представление информации пользователям','Контроль за наличием имущества и обязательств','Активное воздействие на управленческие решения'],0,'По лекции функций три: информировать пользователей, контролировать, влиять на решения. Цены учёт не устанавливает.'],
 ['Каким должен быть учёт, чтобы влиять на управленческие решения?',['Аналитичным и оперативным','Бесплатным и простым','Закрытым от руководства','Только годовым'],0,'Лекция 1: для активного воздействия на решения учёт должен быть аналитичен и оперативен.'],
 ['Кто относится к внешним пользователям с ПРЯМЫМ финансовым интересом?',['Кредиторы','Совет директоров','Пресса','Работники'],0,'Прямой интерес: инвесторы, кредиторы, покупатели, поставщики. Пресса — косвенный интерес, совет директоров и работники — внутренние.'],
 ['Кто относится к внешним пользователям с КОСВЕННЫМ интересом?',['Государственные органы','Инвесторы','Поставщики','Высшие руководители'],0,'Косвенный интерес: госорганы, консультанты, пресса, общество.'],
 ['Кто из перечисленных — внутренний пользователь отчётности?',['Работники','Покупатели','Консультанты','Общество'],0,'Внутренние: собственники, партнёры, совет директоров, руководители всех уровней, работники.'],
 ['Что является предметом бухгалтерского учёта по лекции?',['Финансово-хозяйственная деятельность экономического субъекта с обособленным кругооборотом средств','Налоговые обязательства организации','Бюджет на следующий год','Денежные потоки банка'],0,'Лекция 1, дословно. На семинаре 2 давали другую формулировку: информационное обеспечение управленческих решений.'],

/* generated number tasks */
function rnd(a,b,step){ return Math.round((a+Math.random()*(b-a))/step)*step; }
const fmt = n => n.toLocaleString('ru-RU').replace(/ /g,' ');
function numOpts(r, cands, suffix){
  const out=[r]; cands.concat([r+10000,r-10000,r+20000,r+5000]).forEach(v => { if(out.length<4 && v>0 && !out.includes(v)) out.push(v); });
  return out.map(v => fmt(v)+suffix);
}
function genTask(){
  const kind = Math.floor(Math.random()*4);
  const id = 'g-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  if(kind===0){ // active
    const s=rnd(20000,200000,5000), d=rnd(50000,300000,5000), c=rnd(20000,s+d-5000,5000), r=s+d-c;
    return {id,t:'zad',gen:true,q:'Активный счёт 51: Сн '+fmt(s)+', ОбДт '+fmt(d)+', ОбКт '+fmt(c)+'. Конечное сальдо?',o:numOpts(r,[s+c-d,s+d+c,d-c,r+c],' Дт'),a:0,e:'Ск = Сн + ОбДт − ОбКт = '+fmt(s)+' + '+fmt(d)+' − '+fmt(c)+' = '+fmt(r)+'.'};
  }
  if(kind===1){ // passive
    const s=rnd(10000,150000,5000), c=rnd(50000,250000,5000), d=rnd(10000,s+c-5000,5000), r=s+c-d;
    return {id,t:'zad',gen:true,q:'Пассивный счёт 70: Сн '+fmt(s)+' Кт, ОбДт '+fmt(d)+', ОбКт '+fmt(c)+'. Конечное сальдо?',o:numOpts(r,[s+d-c,s+c+d,c-d],' Кт').slice(0,3).concat([fmt(r)+' Дт']),a:0,e:'Ск = Сн + ОбКт − ОбДт = '+fmt(s)+' + '+fmt(c)+' − '+fmt(d)+' = '+fmt(r)+' по кредиту.'};
  }
  if(kind===2){ // folded 99
    const sk=rnd(10000,100000,5000), d=rnd(20000,150000,5000), c=rnd(10000,120000,5000); const v=-sk+d-c;
    if(v===0) return genTask();
    const ans = v>0 ? fmt(v)+' Дт (убыток)' : fmt(-v)+' Кт (прибыль)';
    const wrong1 = v>0 ? fmt(v)+' Кт (прибыль)' : fmt(-v)+' Дт (убыток)';
    const alt = sk+d-c; const wrong2 = fmt(Math.abs(alt)||5000)+(alt>=0?' Дт (убыток)':' Кт (прибыль)');
    const wrong3 = fmt(sk+d+c)+' Кт (прибыль)';
    const opts=[ans,wrong1,wrong2,wrong3]; if(new Set(opts).size<4) return genTask();
    return {id,t:'zad',gen:true,q:'Счёт 99: СнКт '+fmt(sk)+', ОбДт '+fmt(d)+', ОбКт '+fmt(c)+'. Конечное сальдо?',o:opts,a:0,e:'(СнДт − СнКт) + ОбДт − ОбКт = (0 − '+fmt(sk)+') + '+fmt(d)+' − '+fmt(c)+' = '+(v>0?'+':'−')+fmt(Math.abs(v))+'. '+(v>0?'Плюс — дебет, убыток.':'Минус — кредит, прибыль.')};
  }
  // balance currency
  const V=rnd(300000,900000,10000), x=rnd(10000,90000,5000);
  const ops=[['Получен краткосрочный займ на расчётный счёт',1],['С расчётного счёта погашена задолженность поставщику',-1],['Материалы переданы в основное производство',0],['Уставный капитал увеличен за счёт добавочного',0],['Начислена зарплата рабочим цеха',1],['Покупатель перечислил долг на расчётный счёт',0],['Перечислены налоги в бюджет',-1]];
  const op=ops[Math.floor(Math.random()*ops.length)]; const r=V+op[1]*x;
  const vals=[r,V,V+x,V-x].filter((v,i,a)=>a.indexOf(v)===i); while(vals.length<4) vals.push(V+2*x*vals.length);
  return {id,t:'zad',gen:true,q:'Валюта баланса '+fmt(V)+'. '+op[0]+', '+fmt(x)+'. Какой станет валюта баланса?',o:vals.map(fmt),a:0,e:(op[1]===1?'Тип 1: актив и пассив растут.':op[1]===-1?'Тип 2: актив и пассив уменьшаются.':'Изменения внутри одной стороны: валюта не меняется.')+' Итог: '+fmt(r)+'.'};
}

/* ===================== UTIL ===================== */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function seeded(seed){ return () => { seed = (seed*1664525+1013904223)>>>0; return seed/4294967296; }; }
function seededShuffle(a,seed){ const r=seeded(seed); a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const STATIC = BANK.filter(q=>!q.gen && !q.x);
const isOk = (q,a) => (a===null||a===undefined) ? false : (q.kind==='entry' ? !!a.ok : a===q.a);
const ansText = (q,a) => q.kind==='entry' ? (a.idk ? 'Не знаю' : 'Дт '+a.d+' Кт '+a.k) : (a===-1 ? 'Не знаю' : q.o[a]);
const correctText = q => q.kind==='entry' ? 'Дт '+q.d+' Кт '+q.k : q.o[q.a];
const TICKET_SIZE = 10;
const TICKETS = (() => { const s = seededShuffle(STATIC.map(q=>q.id), 2026); const out=[]; for(let i=0;i<s.length;i+=TICKET_SIZE) out.push(s.slice(i,i+TICKET_SIZE)); if(out.length>1 && out.at(-1).length<6){ const last=out.pop(); out[out.length-1]=out.at(-1).concat(last);} return out; })();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===================== STATE & STORAGE ===================== */
const KEY='finuchet-kr1-v1';
const blank = () => ({v:1, seen:{}, mist:{}, tickets:{}, exams:[], session:null, theme:'auto', updated:0});
let S = blank();
try { const raw = localStorage.getItem(KEY); if(raw){ S = Object.assign(blank(), JSON.parse(raw)); } } catch(e){}
let cloud = {ref:null, ok:false, timer:null};
function save(){
  S.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if(cloud.ok && cloud.ref){ clearTimeout(cloud.timer); cloud.timer = setTimeout(pushCloud, 1500); }
}
function pushCloud(){
  const body = {v:1, seen:S.seen, mist:S.mist, tickets:S.tickets, exams:S.exams.slice(-30), bal:S.bal||null, updated:S.updated};
  cloud.ref.set(body).catch(err => { if(err && (err.code==='invalid_argument'||err.code==='revoked'||err.code==='not_granted')){ cloud.ok=false; renderIfHome(); } });
}
function merge(remote){
  if(!remote) return;
  if(remote.bal && (!S.bal || (remote.bal.n||0) > (S.bal.n||0))) S.bal = remote.bal;
  Object.entries(remote.seen||{}).forEach(([id,r]) => { const l=S.seen[id]; if(!l || (r.n||0)>(l.n||0)) S.seen[id]=r; });
  if((remote.updated||0) > (S.updated||0)) { S.mist = Object.assign({}, S.mist, remote.mist||{}); }
  else { Object.entries(remote.mist||{}).forEach(([id,m]) => { if(!(id in S.mist) && (m.ts||0) > (S.updated||0)) S.mist[id]=m; }); }
  Object.entries(remote.tickets||{}).forEach(([k,r]) => { const l=S.tickets[k]; if(!l || (r.best??99) < (l.best??99) || (r.tries||0)>(l.tries||0)) S.tickets[k]=Object.assign({}, l||{}, r, {best:Math.min(r.best??99, l?.best??99)}); });
  const seenEx = new Set(S.exams.map(x=>x.at)); (remote.exams||[]).forEach(x => { if(!seenEx.has(x.at)) S.exams.push(x); }); S.exams.sort((a,b)=>a.at-b.at);
}
(async function initCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    cloud.ref = db.doc('data/users/'+uid+'/progress');
    const snap = await cloud.ref.get();
    cloud.ok = true;
    if(snap.exists){ merge(snap.data()); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
    pushCloud();
    renderIfHome();
  }catch(e){ cloud.ok=false; }
})();

function applyTheme(){ const r=document.documentElement; if(S.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme); }
applyTheme();

/* ===================== RECORDING ===================== */
function record(q, ok, mode){
  const s = S.seen[q.id] || {n:0, c:0}; s.n++; if(ok) s.c++; s.last = ok?1:0; s.st = ok ? (s.st||0)+1 : 0; S.seen[q.id]=s;
  if(!ok){ S.mist[q.id] = {ts:Date.now(), q: q.gen ? {id:q.id,t:q.t,q:q.q,o:q.o,a:q.a,e:q.e,f:q.f} : null}; }
  else if(mode==='mist'){ delete S.mist[q.id]; }
}
function mistakeList(){ return Object.entries(S.mist).sort((a,b)=>b[1].ts-a[1].ts).map(([id,m]) => BYID[id] || m.q).filter(Boolean); }

/* ===================== SESSION ===================== */
function startSession(mode, title, qs, extra){
  const order = qs.map(q => q.kind==='entry' ? [] : q.f ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i)));
  S.session = Object.assign({mode, title, qs, order, ans: qs.map(()=>null), idx:0, startedAt:Date.now()}, extra||{});
  save(); go('quiz');
}
function liveQ(i){ return S.session.qs[i]; }

function renderIfHome(){ if(screen==='home') render(); }
function header(title, right){ topEl.innerHTML = (screen==='home' ? '' : '<button class="iconbtn" id="back" aria-label="Назад">'+ICON_BACK+'</button>') + '<h1>'+esc(title)+'</h1>' + (right||''); const b=document.getElementById('back'); if(b) b.onclick=()=>{ if(screen==='result'){ go('home'); } else go(screen==='quiz'?'home':'home'); }; }
function setBottom(html){ if(!html){ bottom.hidden=true; bottomIn.innerHTML=''; return; } bottom.hidden=false; bottomIn.innerHTML=html; }

function stats(){
  const ids = STATIC.map(q=>q.id); let seen=0, n=0, c=0;
  ids.forEach(id => { const s=S.seen[id]; if(s){ seen++; } });
  Object.values(S.seen).forEach(s => { n+=s.n; c+=s.c; });
  return {seen, total:ids.length, acc: n? Math.round(c/n*100) : null, mist:Object.keys(S.mist).length};
}

function ticketsDone(){ return Object.values(S.tickets).filter(t=>t.best===0).length; }

function startExam(){
  // proportional spread over topics
  const byT = {}; STATIC.concat(KR_POOL).forEach(q => (byT[q.t]=byT[q.t]||[]).push(q));
  const plan = {kr:3,osn:1,sred:2,metod:2,bal:2,vliy:2,scheta:2,s27:2,prov:3,zad:1,otch:1};
  let qs=[]; Object.entries(plan).forEach(([t,n]) => qs = qs.concat(shuffle(byT[t]).slice(0,n)));
  qs.splice(Math.floor(Math.random()*qs.length),0,genTask()); qs = shuffle(qs).slice(0,20);
  startSession('exam','Экзамен', qs, {limit:20*60*1000});
}
function startZad(){
  const qs = shuffle(RAW.zad.map((_,i)=>BYID['zad-'+i])).slice(0,6);
  for(let i=0;i<6;i++) qs.push(genTask());
  startSession('zad','Мини-задачи', shuffle(qs));
}

function renderQuiz(){
  const ses = S.session; if(!ses){ go('home'); return; }
  const i = ses.idx, q = liveQ(i), ord = ses.order[i], chosen = ses.ans[i];
  const answeredN = ses.ans.filter(a=>a!==null).length;
  const right = ses.mode==='exam' ? `<span class="counter" id="timer"></span>` : `<span class="counter">${i+1}/${ses.qs.length}</span>`;
  header(ses.title, right);
  const pills = ses.qs.length<=40 ? `<div class="pills" id="pills">${ses.qs.map((qq,k)=>{ const a=ses.ans[k]; const cls = a===null?'':(isOk(qq,a)?'ok':'bad'); return `<button class="pill ${cls} ${k===i?'cur':''}" data-k="${k}">${k+1}</button>`; }).join('')}</div>` : `<div class="bar"><i style="width:${Math.round(answeredN/ses.qs.length*100)}%"></i></div>`;
  const letters='АБВГДЕ';
  const isEntry = q.kind==='entry', done = chosen!==null;
  let body;
  if(isEntry){
    const dOk = done && chosen.d===q.d, kOk = done && chosen.k===q.k;
    body = `<div class="entry">
        <label class="slot ${done?(dOk?'ok':'bad'):'active'}" id="slotD"><span>Дебет</span><input id="inD" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" placeholder="—" value="${done?esc(chosen.d):''}" ${done?'disabled':''}></label>
        <label class="slot ${done?(kOk?'ok':'bad'):''}" id="slotK"><span>Кредит</span><input id="inK" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" placeholder="—" value="${done?esc(chosen.k):''}" ${done?'disabled':''}></label>
      </div>
      ${done ? `<div class="expl ${chosen.ok?'good':'bad'}"><b>${chosen.ok?'Верно: ':(chosen.idk?'Правильно: ':'Неверно. Правильно: ')}Дт ${q.d} Кт ${q.k}</b><span>${esc(q.e||'')}</span></div>`
             : `<div class="keypad">${KEYS.map(n=>`<button class="key" data-n="${n}">${n}</button>`).join('')}</div><p class="note" id="enote">Впиши номера счетов или нажимай на них: сначала заполнится дебет, потом кредит.</p>`}`;
  } else {
    body = `<div class="opts">${ord.map((oi,pos)=>{ let cls=''; if(done){ if(oi===q.a) cls='ok'; else if(oi===chosen) cls='bad'; else cls='dim'; } return `<button class="opt ${cls}" data-oi="${oi}" ${done?'disabled':''}><span class="mk">${done&&oi===q.a?'✓':done&&oi===chosen?'✕':letters[pos]}</span><span>${esc(q.o[oi])}</span></button>`; }).join('')}<button class="opt idk ${done?(chosen===-1?'bad':'dim'):''}" data-oi="-1" ${done?'disabled':''}><span class="mk">?</span><span>Не знаю</span></button></div>
    ${done ? `<div class="expl ${chosen===q.a?'good':'bad'}"><b>${chosen===q.a?'Верно':(chosen===-1?'Правильно: ':'Неверно. Правильно: ')+esc(q.o[q.a])}</b><span>${esc(q.e||'')}</span></div>` : ''}`;
  }
  view.innerHTML = `${pills}
    <div class="qtag">${esc(TOPICS[q.t]||'')}</div>
    <p class="qtext">${esc(q.q)}${isEntry?'':''}</p>
    ${body}`;
  const last = i===ses.qs.length-1, allDone = ses.ans.every(a=>a!==null);
  const nextLabel = !done ? 'Пропустить' : (allDone ? 'Результат' : (last ? 'К пропущенным' : 'Дальше'));
  if(isEntry && !done) setBottom(`<button class="act ghost" id="idk">Не знаю</button><button class="act main" id="check">Проверить</button>`);
  else setBottom(`<button class="act ghost" id="finish">Завершить</button><button class="act ${done?'main':''}" id="next">${nextLabel}</button>`);
  view.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.oi));
  view.querySelectorAll('.pill').forEach(b => b.onclick = () => { ses.idx=+b.dataset.k; save(); render(); });
  const cur = view.querySelector('.pill.cur'); if(cur) cur.scrollIntoView({block:'nearest',inline:'center'});
  const nb=document.getElementById('next'); if(nb) nb.onclick = next;
  const ik=document.getElementById('idk'); if(ik) ik.onclick = () => { if(ses.ans[i]!==null) return; ses.ans[i]={d:'',k:'',ok:false,idk:true}; record(q,false,ses.mode); save(); render(); };
  const fb=document.getElementById('finish');
  if(fb){ let armed=false; fb.onclick = e => { if(allDone){ finish(); return; } if(!armed){ armed=true; e.currentTarget.textContent='Точно?'; setTimeout(()=>{armed=false; const f=document.getElementById('finish'); if(f) f.textContent='Завершить';},2500); return; } finish(); }; }
  if(isEntry && !done) wireEntry(q);
  if(ses.mode==='exam') tick();
}
function normAcc(v){ v=String(v||'').replace(/\D/g,'').slice(0,2); return v.length===1 ? '0'+v : v; }
function wireEntry(q){
  const inD=document.getElementById('inD'), inK=document.getElementById('inK'), sD=document.getElementById('slotD'), sK=document.getElementById('slotK');
  let active='D';
  const mark=()=>{ sD.classList.toggle('active',active==='D'); sK.classList.toggle('active',active==='K'); };
  inD.onfocus=()=>{active='D';mark();}; inK.onfocus=()=>{active='K';mark();};
  sD.onclick=()=>{active='D';mark();}; sK.onclick=()=>{active='K';mark();};
  inD.oninput=()=>{ inD.value=inD.value.replace(/\D/g,'').slice(0,2); if(inD.value.length===2){ active='K'; mark(); if(document.activeElement===inD) inK.focus(); } };
  inK.oninput=()=>{ inK.value=inK.value.replace(/\D/g,'').slice(0,2); };
  [inD,inK].forEach(x=>x.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); checkEntry(q); } });
  view.querySelectorAll('.key').forEach(b=>b.onclick=()=>{ if(active==='D'){ inD.value=b.dataset.n; active='K'; } else { inK.value=b.dataset.n; } mark(); });
  document.getElementById('check').onclick=()=>checkEntry(q);
}
function checkEntry(q){
  const ses=S.session, i=ses.idx; if(ses.ans[i]!==null) return;
  const d=normAcc(document.getElementById('inD').value), k=normAcc(document.getElementById('inK').value);
  if(!d||!k){ const n=document.getElementById('enote'); if(n){ n.textContent='Заполни и дебет, и кредит.'; n.style.color='var(--bad)'; } return; }
  const ok = d===q.d && k===q.k;
  ses.ans[i]={d,k,ok}; record(q, ok, ses.mode); save(); render();
}
function tick(){
  const el=document.getElementById('timer'); const ses=S.session; if(!el||!ses) return;
  const upd=()=>{ const left=Math.max(0, ses.limit-(Date.now()-ses.startedAt)); const m=Math.floor(left/60000), s=Math.floor(left%60000/1000); el.textContent=m+':'+String(s).padStart(2,'0'); if(left<=0){ clearInterval(timerInt); finish(); } };
  upd(); timerInt=setInterval(upd,1000);
}
function answer(oi){
  const ses=S.session, i=ses.idx, q=liveQ(i); if(ses.ans[i]!==null) return;
  ses.ans[i]=oi; record(q, oi===q.a, ses.mode); save(); render();
  if(oi===q.a){ const ex=view.querySelector('.expl'); if(ex) ex.scrollIntoView({block:'nearest',behavior:'smooth'}); } else { const ex=view.querySelector('.expl'); if(ex) ex.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function next(){
  const ses=S.session; if(ses.ans.every(a=>a!==null)){ finish(); return; }
  let k = ses.idx+1; while(k<ses.qs.length && ses.ans[k]!==null) k++;
  if(k>=ses.qs.length){ k = ses.ans.findIndex(a=>a===null); }
  ses.idx=k; save(); render();
}
function finish(){
  const ses=S.session; if(!ses) return;
  const total=ses.qs.length, score=ses.qs.filter((q,k)=>isOk(q,ses.ans[k])).length, errs=ses.qs.filter((q,k)=>ses.ans[k]!==null&&!isOk(q,ses.ans[k])).length, skipped=ses.ans.filter(a=>a===null).length;
  const res = {mode:ses.mode, title:ses.title, total, score, errs, skipped, wrong: ses.qs.map((q,k)=>({q,a:ses.ans[k]})).filter(x=>!isOk(x.q,x.a))};
  if(ses.mode==='ticket'){ const t=S.tickets[ses.ticket]||{tries:0}; t.tries=(t.tries||0)+1; const e=errs+skipped; t.best=Math.min(t.best??99, e); t.last=e; S.tickets[ses.ticket]=t; res.ticket=ses.ticket; }
  if(ses.mode==='exam'){ res.ok = errs+skipped<=2; S.exams.push({at:Date.now(), score, total, ok:res.ok}); }
  S.session=null; save(); go('result', res);
}

const LEVELS = [
  ['great','Знаю отлично','Верно 2+ раза подряд, точность от 80%'],
  ['good','Знаю хорошо','Последний ответ верный'],
  ['bad','Знаю плохо','Последний ответ неверный или точность ниже 50%'],
  ['none','Не знаю совсем','Ещё ни разу не ответил верно']
];
function levelOf(s){
  if(!s || !s.n) return null;
  const acc = s.c/s.n, st = s.st ?? (s.last ? 1 : 0);
  if(s.last===0) return s.c===0 ? 'none' : 'bad';
  if(acc < 0.5) return 'bad';
  if(st >= 2 && acc >= 0.8) return 'great';
  return 'good';
}
function clusters(){
  const out = {great:[], good:[], bad:[], none:[], fresh:[]};
  Object.values(BYID).forEach(q => out[levelOf(S.seen[q.id]) || 'fresh'].push(q));
  return out;
}

let balR = null;
const SECN = ['I · Внеоборотные активы','II · Оборотные активы','III · Капитал','IV · Долгосрочные обязательства','V · Краткосрочные обязательства'];
function genBalance(){
  const r=(a,b)=>rnd(a,b,10000), p=x=>Math.random()<x, it=[];
  const os=r(800000,2000000), am=r(100000,Math.max(110000,Math.floor(os*0.4/10000)*10000));
  it.push(['Основные средства (первоначальная стоимость)',os,0,1],['Накопленная амортизация основных средств',am,0,-1],['Нематериальные активы',r(50000,300000),0,1]);
  if(p(.7)) it.push(['Долгосрочные финансовые вложения',r(50000,300000),0,1]);
  it.push(['Материалы',r(100000,400000),1,1],['Готовая продукция',r(80000,300000),1,1],['Дебиторская задолженность покупателей',r(80000,300000),1,1],['Денежные средства на расчётном счёте',r(150000,700000),1,1]);
  if(p(.6)) it.push(['Товары',r(60000,300000),1,1]);
  if(p(.5)) it.push(['Краткосрочные финансовые вложения',r(40000,200000),1,1]);
  if(p(.4)) it.push(['Касса',r(10000,50000),1,1]);
  if(p(.4)) it.push(['Авансы, выданные поставщикам',r(20000,120000),1,1]);
  if(p(.3)) it.push(['НДС по приобретённым ценностям',r(10000,80000),1,1]);
  it.push(['Уставный капитал',r(300000,800000),2,1]);
  if(p(.7)) it.push(['Добавочный капитал',r(50000,200000),2,1]);
  if(p(.6)) it.push(['Резервный капитал',r(30000,150000),2,1]);
  if(p(.5)) it.push(['Кредит банка на 3 года',r(200000,500000),3,1]);
  it.push(['Задолженность поставщикам',r(100000,350000),4,1],['Задолженность по заработной плате',r(60000,200000),4,1]);
  if(p(.7)) it.push(['Задолженность по налогам',r(30000,120000),4,1]);
  if(p(.6)) it.push(['Авансы, полученные от покупателей',r(40000,150000),4,1]);
  if(p(.6)) it.push(['Краткосрочный займ',r(100000,300000),4,1]);
  if(p(.3)) it.push(['Задолженность по страховым взносам',r(20000,80000),4,1]);
  const sumA = () => it.filter(x=>x[2]<2).reduce((t,x)=>t+x[1]*x[3],0);
  const sumP = () => it.filter(x=>x[2]>=2).reduce((t,x)=>t+x[1],0);
  let np = sumA()-sumP();
  if(np < 50000){ const m = it.find(x=>x[0].startsWith('Денежные')); m[1] += (50000-np) + r(0,300000); np = sumA()-sumP(); }
  it.push(['Нераспределённая прибыль',np,2,1]);
  const tot=[0,0,0,0,0]; it.forEach(x=>tot[x[2]]+=x[1]*x[3]);
  return {items: shuffle(it), tot, val: tot[0]+tot[1], ans:['','','','','',''], checked:false};
}
function newBalance(){ balR = genBalance(); go('balance'); }

    <p class="note">Посчитай итог каждого раздела и валюту баланса. Амортизацию вычти из основных средств, IV раздел может быть пустым — тогда впиши 0.</p>
    <div class="wrong">${B.items.map(x=>`<div class="brow"><span class="bn">${esc(x[0])}</span><span class="ba">${fmt(x[1])}</span>${B.checked?`<span class="btag">${x[3]<0?'I, вычесть':L[x[2]]}</span>`:''}</div>`).join('')}</div>

  if(B.checked) setBottom(`<button class="act ghost" id="home">Меню</button><button class="act main" id="newb">Новая задача</button>`);
  else setBottom(`<button class="act ghost" id="home">Меню</button><button class="act main" id="chkb">Проверить</button>`);
  document.getElementById('home').onclick=()=>go('home');
  const nb=document.getElementById('newb'); if(nb) nb.onclick=newBalance;
  if(!B.checked){
    [0,1,2,3,4,5].forEach(k=>{ const el=document.getElementById('bv'+k); el.oninput=()=>{ const d=el.value.replace(/\D/g,'').slice(0,10); el.value = d ? fmt(+d) : ''; B.ans[k]=el.value; }; el.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const n=document.getElementById('bv'+(k+1)); if(n) n.focus(); else el.blur(); } }; });
    document.getElementById('chkb').onclick=()=>{ B.checked=true; const ok=want.every((_,k)=>okAt(k)); S.bal=S.bal||{n:0,perfect:0}; S.bal.n++; if(ok) S.bal.perfect++; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); };
  }
}
